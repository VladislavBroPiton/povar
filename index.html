<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<body>
<header class="top">
  <a class="logo" href="#/" aria-label="На главную">
    <img src="icons/icon-192.png" alt="" width="32" height="32">
    <span>Что приготовить</span>
  </a>
  <button class="city-btn" id="cityBtn" type="button" aria-label="Выбрать город">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span id="cityName">Город…</span>
  </button>
  <button class="install-btn" id="installBtn" type="button" hidden>Установить</button>
</header>

<div class="city-confirm" id="cityConfirm" hidden>
  <p id="cityConfirmText">Похоже, вы в городе…</p>
  <div class="row">
    <button class="btn primary" id="cityYes" type="button">Да, верно</button>
    <button class="btn" id="cityNo" type="button">Другой город</button>
  </div>
</div>

<nav class="tabs" aria-label="Разделы">
  <a href="#/" data-tab="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Подбор</span></a>
  <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h3M8 17h6"/></svg><span>Меню</span></a>
  <a href="#/list" data-tab="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2M4 12h2M4 18h2M9 6h11M9 12h11M9 18h11"/></svg><span>Покупки</span><b class="badge" id="listBadge" hidden></b></a>
  <a href="#/fav" data-tab="fav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg><span>Избранное</span></a>
  <a href="#/help" data-tab="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg><span>Шпаргалки</span></a>
</nav>

<main id="app" tabindex="-1"></main>

<div class="timer-bar" id="timerBar" hidden></div>

<dialog id="sheet" class="sheet">
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<noscript><p style="padding:24px">Для работы сайта включите JavaScript.</p></noscript>

<script src="config.js?v=4"></script>

<script src="data/cities.js?v=4"></script>
<script src="data/recipes.js?v=4"></script>
<script src="data/help.js?v=4"></script>
<script src="core.js?v=4"></script>
<script src="ui.js?v=4"></script>
<script src="online.js?v=4"></script>
</body>
</html>
