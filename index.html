<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что приготовить переехал на kindtools.github.io</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kindtools.github.io/">
<style>body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#f7f3ec;color:#2b1e16;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box;text-align:center}a{color:#b4532f}</style>
<script>
// Старый адрес. Переношу человека на новый сайт вместе с его данными (избранное, списки, холодильник, настройки)
(function () {
  var NEW = 'https://kindtools.github.io/';
  var path = location.pathname.replace(/^\/povar\/?/, '');
  if (/^(index\.html)?$/.test(path)) path = '';
  var hash = location.hash || '';
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('cook.') === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) { /* без данных */ }
  var url = NEW + path;
  if (!path && Object.keys(data).length) {
    var b = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    url = NEW + '#/import=' + b + hash;
  } else {
    url += hash;
  }
  location.replace(url);
})();
</script>
</head><body><p>Сайт «Что приготовить» переехал на <a href="https://kindtools.github.io/">kindtools.github.io</a>. Сейчас откроется новый адрес</p></body></html>
