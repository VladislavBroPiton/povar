name: Еженедельный осмотр сайта
# Каждый понедельник: битые ссылки + скорость и качество (Lighthouse) главной и страницы рецепта на телефоне.
# Итог приходит владельцу в Telegram, полные отчёты лежат в «Artifacts» этого запуска.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ссылки
        continue-on-error: true
        run: python3 tests/links.py
      - name: Lighthouse
        run: |
          mkdir -p lh
          for p in "home|" "recipe|r/sharlotka.html" "list|q/iz-kuricy.html"; do
            n="${p%%|*}"; u="https://vladislavbropiton.github.io/povar/${p#*|}"
            npx -y lighthouse@12.2.1 "$u" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html --output-path="lh/$n" || true
          done
      - name: Отчёт в Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          names = {'home': 'Главная', 'recipe': 'Рецепт', 'list': 'Подборка'}
          cats = [('performance', 'скорость'), ('accessibility', 'доступность'), ('best-practices', 'практики'), ('seo', 'SEO')]
          lines = ['🩺 Еженедельный осмотр сайта', '']
          for k, title in names.items():
              f = pathlib.Path(f'lh/{k}.report.json')
              if not f.exists():
                  lines.append(f'{title}: Lighthouse не отработал'); continue
              d = json.loads(f.read_text())
              sc = ' · '.join(f"{n} {round((d['categories'][c]['score'] or 0) * 100)}" for c, n in cats)
              lcp = d['audits']['largest-contentful-paint']['displayValue']
              lines.append(f'{title}: {sc} · главное на экране за {lcp}')
          rep = pathlib.Path('links-report.txt')
          lines += ['', 'Ссылки: ' + (rep.read_text().strip() if rep.exists() else 'проверка не отработала')]
          lines += ['', 'Подробно: ' + os.environ['RUN_URL']]
          text = '\n'.join(lines)[:4000]
          print(text)
          req = urllib.request.Request(f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                                       data=json.dumps({'chat_id': os.environ['TG_CHAT'], 'text': text, 'disable_web_page_preview': True}).encode(),
                                       headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req, timeout=30)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            lh/
            links-report.txt
          retention-days: 30
